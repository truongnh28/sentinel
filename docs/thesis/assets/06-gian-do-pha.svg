<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470"
     role="img" aria-labelledby="pha-title pha-desc">
  <title id="pha-title">Giản đồ pha trên mặt phẳng độ trễ Δ và lệch giá χ</title>
  <desc id="pha-desc">Mặt phẳng hai trục: trục ngang là độ trễ trigger Δ quét qua các mức 0, 1, 2, 4, 8; trục dọc là độ lệch chi phí carrier χ quét qua 0, 0,5 và 1,34. Một đường ranh giới chạy từ dưới trái lên trên phải chia mặt phẳng làm hai chế độ: bên trái audit-at-commit là đủ, bên phải cần phân bổ thích nghi. Ranh giới dịch sang phải khi χ tăng. Mức Δ quan sát được khoảng 2,1 nằm gần ranh giới ở chế độ χ thấp.</desc>

  <defs>
    <marker id="pha-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2d3142"/>
    </marker>
  </defs>

  <rect width="960" height="470" fill="#f5f5f5"/>

  <!-- ─────────── header ─────────── -->
  <text x="20" y="30" fill="#7a8399" font-size="8" font-family="'SF Mono', Menlo, Consolas, monospace"
        font-weight="500" letter-spacing="0.18em">GIẢN ĐỒ PHA · MỤC 4.6 · HỆ QUẢ 5</text>
  <text x="20" y="58" fill="#2d3142" font-size="21" font-family="Georgia, 'Times New Roman', serif">Đo Δ và χ tại tổ chức của bạn, rồi đọc ra câu trả lời.</text>

  <!-- ─────────── hai chế độ ─────────── -->
  <path d="M 140 356 L 480 356 C 545 320 615 250 710 116 L 140 116 Z" fill="rgba(45,49,66,0.035)"/>
  <path d="M 480 356 L 820 356 L 820 116 L 710 116 C 615 250 545 320 480 356 Z" fill="rgba(235,108,54,0.06)"/>

  <!-- lưới mờ -->
  <g stroke="rgba(45,49,66,0.07)" stroke-width="0.8">
    <line x1="140" y1="256" x2="820" y2="256"/>
    <line x1="140" y1="136" x2="820" y2="136"/>
    <line x1="310" y1="116" x2="310" y2="356"/>
    <line x1="480" y1="116" x2="480" y2="356"/>
    <line x1="650" y1="116" x2="650" y2="356"/>
  </g>

  <!-- ranh giới chế độ (focal) -->
  <path d="M 480 356 C 545 320 615 250 710 116" fill="none" stroke="#eb6c36" stroke-width="1.4"/>

  <!-- ─────────── trục ─────────── -->
  <line x1="140" y1="356" x2="860" y2="356" stroke="#2d3142" stroke-width="1.2" marker-end="url(#pha-arrow)"/>
  <line x1="140" y1="356" x2="140" y2="100" stroke="#2d3142" stroke-width="1.2" marker-end="url(#pha-arrow)"/>

  <text x="140" y="86" fill="#2d3142" font-size="9" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.18em">LỆCH GIÁ</text>
  <text x="876" y="360" fill="#2d3142" font-size="9" font-family="'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">ĐỘ TRỄ</text>
  <text x="122" y="112" fill="#7a8399" font-size="13" font-family="Georgia, 'Times New Roman', serif" font-style="italic" text-anchor="end">χ</text>
  <text x="876" y="378" fill="#7a8399" font-size="13" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Δ</text>

  <!-- vạch chia -->
  <g stroke="#2d3142" stroke-width="1">
    <line x1="140" y1="356" x2="140" y2="362"/><line x1="310" y1="356" x2="310" y2="362"/>
    <line x1="480" y1="356" x2="480" y2="362"/><line x1="650" y1="356" x2="650" y2="362"/>
    <line x1="820" y1="356" x2="820" y2="362"/>
    <line x1="134" y1="356" x2="140" y2="356"/><line x1="134" y1="256" x2="140" y2="256"/><line x1="134" y1="136" x2="140" y2="136"/>
  </g>
  <g fill="#4f5d75" font-size="8" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="140" y="376">0</text><text x="310" y="376">1</text><text x="480" y="376">2</text>
    <text x="650" y="376">4</text><text x="820" y="376">8</text>
  </g>
  <g fill="#4f5d75" font-size="8" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="end">
    <text x="128" y="359">0</text><text x="128" y="259">0,5</text><text x="128" y="139">1,34</text>
  </g>

  <!-- ─────────── nhãn hai chế độ ─────────── -->
  <text x="160" y="286" fill="#7a8399" font-size="8" font-family="'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">CHẾ ĐỘ A</text>
  <text x="160" y="306" fill="#2d3142" font-size="14" font-weight="600" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">Audit-at-commit là đủ</text>
  <text x="160" y="323" fill="#4f5d75" font-size="10" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">B1 là lựa chọn hợp lý — đừng mua thêm gì</text>

  <text x="640" y="266" fill="#eb6c36" font-size="8" font-family="'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">CHẾ ĐỘ B</text>
  <text x="640" y="286" fill="#eb6c36" font-size="13" font-weight="600" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">Cần phân bổ thích nghi</text>
  <text x="640" y="303" fill="#4f5d75" font-size="10" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">chỉ quét được một vạch ngang,</text>
  <text x="640" y="317" fill="#4f5d75" font-size="10" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">không phủ nổi vùng Δ × K</text>

  <!-- ─────────── mức Δ quan sát được ─────────── -->
  <line x1="497" y1="340" x2="497" y2="316" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="3,3"/>
  <polygon points="491,350 503,350 497,338" fill="#2d3142"/>
  <rect x="404" y="384" width="186" height="13" fill="#f5f5f5"/>
  <text x="497" y="394" fill="#2d3142" font-size="9" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" font-weight="600">dự đoán Δ ≈ 2 · quan sát 2,1</text>

  <text x="940" y="394" fill="#7a8399" font-size="7" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.12em">TRỤC LÀ CÁC MỨC ĐƯỢC QUÉT, KHÔNG THEO TỈ LỆ</text>

  <!-- ─────────── callout ─────────── -->
  <text x="480" y="420" fill="#4f5d75" font-size="13" font-family="Georgia, 'Times New Roman', serif" font-style="italic" text-anchor="middle">Tăng χ đẩy ranh giới sang phải — chi phí lệch nhau làm phân bổ thích nghi thắng muộn hơn, không sớm hơn.</text>

  <!-- ─────────── legend ─────────── -->
  <line x1="20" y1="436" x2="940" y2="436" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="20" y="456" fill="#7a8399" font-size="8" font-family="'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

  <rect x="92" y="448" width="16" height="9" rx="2" fill="rgba(45,49,66,0.035)" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
  <text x="114" y="456" fill="#4f5d75" font-size="9" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">audit-at-commit đủ</text>

  <rect x="250" y="448" width="16" height="9" rx="2" fill="rgba(235,108,54,0.06)" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
  <text x="272" y="456" fill="#4f5d75" font-size="9" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">cần phân bổ thích nghi</text>

  <line x1="430" y1="452.5" x2="446" y2="452.5" stroke="#eb6c36" stroke-width="1.4"/>
  <text x="452" y="456" fill="#4f5d75" font-size="9" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">ranh giới chế độ — Hệ quả 5</text>

  <polygon points="650,456 662,456 656,446" fill="#2d3142"/>
  <text x="670" y="456" fill="#4f5d75" font-size="9" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">mức Δ quan sát được</text>
</svg>
